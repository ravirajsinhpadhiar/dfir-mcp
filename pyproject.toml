[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfir-mcp"
version = "0.1.0"
description = "Digital forensics for AI agents: an MCP server that parses Windows event logs, registry hives and browser history read-only, with a hash and stated limitations on every result."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ravirajsinh Padhiar" }]
keywords = ["dfir", "digital-forensics", "incident-response", "mcp", "evtx", "registry", "timeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = ["mcp>=1.2", "python-evtx>=0.8", "regipy>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dfir-mcp = "dfir_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ravirajsinhpadhiar/dfir-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/dfir_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
